<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP_PREP: 2, JUMP: 3, LANDING: 4, SCATTER: 5, REASSEMBLE: 6 };

const char = {
  x: 0, y: 0, baseY: 0,
  vx: 0, vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  eyeBlink: 0, eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  crouch: 0,
  crouchV: 0,
  walkBlend: 0,
  jellyV: 0,
  jellyD: 0,
};

// ─── Particle System ───
let particles = [];
let scatterTimer = 0;

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  if (char.state === STATE.SCATTER || char.state === STATE.REASSEMBLE) return;

  const r = Math.random();
  if (r < 0.12) {
    // Scatter!
    startScatter(time);
  } else if (r < 0.42) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.72) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP_PREP;
    char.stateTimer = 0;
    char.crouch = 0;
    char.crouchV = 0;
    char.vx *= 0.3;
    char.nextActionTime = time + 3000;
  }
}

function startScatter(time) {
  const targets = computeDotTargets();
  let eyeWhiteIdx = -1;
  particles = targets.map((t, idx) => {
    const p = {
      x: t.x, y: t.y, r: t.r, color: t.color,
      vx: (Math.random() - 0.5) * 8 + (t.x - char.x) * 0.08,
      vy: -(2 + Math.random() * 5),
      tx: t.x - char.x, ty: t.y - char.y,
      onGround: false,
      eye: t.eye || null,
      part: t.part || (t.eye ? 'eye' : 'body'),
      parentIdx: -1,  // for pupil → follows white eye
      reassembleDelay: 0,
      reassemblePhase: 0, // 0=waiting, 1=bouncing toward target
      bounceVx: 0, bounceVy: 0,
    };
    if (t.eye === 'white') eyeWhiteIdx = idx;
    if (t.eye === 'pupil') p.parentIdx = -2;  // placeholder, set below
    return p;
  });
  // Link pupil to white eye
  for (const p of particles) {
    if (p.parentIdx === -2) p.parentIdx = eyeWhiteIdx;
  }
  // Pupil gets no independent velocity
  if (eyeWhiteIdx >= 0) {
    for (const p of particles) {
      if (p.eye === 'pupil' && p.parentIdx >= 0) {
        p.vx = 0; p.vy = 0;
      }
    }
  }
  char.state = STATE.SCATTER;
  char.stateTimer = 0;
  char.vx = 0;
  scatterTimer = 0;
}

// ─── Compute dot target positions (extracted from draw logic) ───
function computeDotTargets() {
  const R = 7;
  const BR = 14;
  const ORANGE = '#f07820';
  const L = 11;
  const dots = [];

  const bx = char.x;
  const ground = char.y;
  const wb = char.walkBlend;

  const squashAmt = char.crouch * 0.006 + char.jellyD * 0.008;
  const bodyRx = 44 * (1 + squashAmt);
  const bodyRy = 34 * (1 - squashAmt * 0.7);
  const standH = L * 1.96;
  const walkBob = wb * Math.cos(char.legPhase * 2) * 3.5;
  const crouchOffset = Math.max(0, char.crouch);
  const hipY = ground - standH + crouchOffset + walkBob;
  const bodyY = hipY - bodyRy + 5;

  const hipSpacing = 9;
  const stanceLen = 9;

  // Legs
  for (let side = -1; side <= 1; side += 2) {
    const hx = bx + side * hipSpacing;
    const hy = hipY;
    let fx, fy;
    const restSpacing = stanceLen * 0.7;

    if (char.state === STATE.JUMP_PREP) {
      fx = hx + side * restSpacing; fy = ground;
    } else if (char.state === STATE.JUMP) {
      const stretch = 1.0 + 0.25 * Math.max(0, -char.vy / 10);
      fx = hx + side * restSpacing; fy = hy + L * 2.1 * stretch;
    } else if (char.state === STATE.LANDING) {
      fx = hx + side * restSpacing; fy = ground;
    } else if (wb < 0.01) {
      fx = hx + side * restSpacing; fy = ground;
    } else {
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      const p = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      if (p < Math.PI) {
        const t = p / Math.PI;
        fx = hx + (-stanceLen + t * 2 * stanceLen) * wb * char.dir;
        fy = ground - Math.sin(t * Math.PI) * 7 * wb;
      } else {
        const t = (p - Math.PI) / Math.PI;
        fx = hx + (stanceLen - t * 2 * stanceLen) * wb * char.dir;
        fy = ground;
      }
    }

    const dx = fx - hx, dy = fy - hy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const d = Math.min(dist, L * 2 - 0.1);
    let kx, ky;
    if (char.state === STATE.JUMP) {
      kx = (hx + fx) / 2; ky = (hy + fy) / 2;
    } else if (wb < 0.01 && char.state === STATE.IDLE) {
      kx = (hx + fx) / 2; ky = (hy + fy) / 2;
    } else if (d < 1) {
      kx = hx + side * L * 0.7; ky = hy + L * 0.7;
    } else {
      const cosA = Math.max(-1, Math.min(1, d / (2 * L)));
      const a = Math.acos(cosA);
      const baseAng = Math.atan2(dy, dx);
      const kneeAng = baseAng - side * a;
      kx = hx + Math.cos(kneeAng) * L; ky = hy + Math.sin(kneeAng) * L;
    }
    dots.push({ x: hx, y: hy, r: R, color: ORANGE, part: 'leg' });
    dots.push({ x: kx, y: ky, r: R, color: ORANGE, part: 'leg' });
    dots.push({ x: fx, y: fy, r: R, color: ORANGE, part: 'leg' });
  }

  // Body
  const ringGap = BR * 1.0;
  const numRings = Math.ceil(Math.min(bodyRx, bodyRy) / ringGap);
  for (let i = numRings; i >= 0; i--) {
    const scale = i / numRings;
    const rx = bodyRx * scale;
    const ry = bodyRy * scale;
    if (rx < 1 && ry < 1) {
      dots.push({ x: bx, y: bodyY, r: BR, color: ORANGE, part: 'body' });
    } else {
      const circ = 2 * Math.PI * Math.max(rx, ry);
      const n = Math.max(1, Math.round(circ / (BR * 1.5)));
      const angOff = (i % 2 === 0) ? 0 : Math.PI / n;
      for (let j = 0; j < n; j++) {
        const a = (Math.PI * 2 * j) / n + angOff;
        dots.push({ x: bx + Math.cos(a) * rx, y: bodyY + Math.sin(a) * ry, r: BR, color: ORANGE, part: 'body' });
      }
    }
  }

  // Eye (grouped so they stay together during scatter)
  const eyeX = bx + char.dir * bodyRx * 0.2;
  const eyeY = bodyY - bodyRy * 0.1;
  dots.push({ x: eyeX, y: eyeY, r: R * 2.2, color: '#fff', eye: 'white' });
  dots.push({ x: eyeX, y: eyeY, r: R * 1.1, color: '#000', eye: 'pupil' });

  return dots;
}

// ─── Update ───
function update(time, dt) {
  const base = groundY();
  char.baseY = base;

  // Scatter / Reassemble states
  if (char.state === STATE.SCATTER) {
    scatterTimer += dt;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      // Pupil follows white eye
      if (p.eye === 'pupil' && p.parentIdx >= 0) {
        const parent = particles[p.parentIdx];
        p.x = parent.x;
        p.y = parent.y;
        continue;
      }
      if (!p.onGround) {
        p.vy += 0.25;
        p.x += p.vx;
        p.y += p.vy;
        if (p.y >= base + p.r * 0.5) {
          p.y = base + p.r * 0.5;
          p.vy = -p.vy * 0.2;
          if (Math.abs(p.vy) < 1) {
            p.vy = 0;
            p.onGround = true;
          }
        }
      } else {
        p.vx *= 0.97;
        p.x += p.vx;
      }
    }
    if (scatterTimer > 2500) {
      // Transition to reassemble: give each particle a staggered bounce-back
      const targets = computeDotTargets();
      for (let i = 0; i < particles.length && i < targets.length; i++) {
        const p = particles[i];
        // Staggered by part: legs first, body next, eye last
        const baseDelay = p.part === 'leg' ? 0
                        : p.part === 'body' ? 600
                        : 1400;  // eye
        p.reassembleDelay = baseDelay + Math.random() * 400;
        p.reassemblePhase = 0;
        p.onGround = false;
      }
      char.state = STATE.REASSEMBLE;
      char.stateTimer = 0;
      scatterTimer = 0;
    }
    return;
  }

  if (char.state === STATE.REASSEMBLE) {
    scatterTimer += dt;
    const targets = computeDotTargets();
    let allDone = true;

    for (let i = 0; i < particles.length && i < targets.length; i++) {
      const p = particles[i];
      const t = targets[i];

      // Pupil follows white eye during reassembly too
      if (p.eye === 'pupil' && p.parentIdx >= 0) {
        const parent = particles[p.parentIdx];
        p.x = parent.x;
        p.y = parent.y;
        p.color = t.color;
        p.r += (t.r - p.r) * 0.15;
        continue;
      }

      p.reassembleDelay -= dt;
      if (p.reassembleDelay > 0) {
        // Still waiting, keep rolling
        p.vx *= 0.98;
        p.x += p.vx;
        allDone = false;
        continue;
      }

      if (p.reassemblePhase === 0) {
        // Launch toward target with an arc
        const dx = t.x - p.x;
        const dy = t.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = Math.max(3, dist * 0.04);
        p.bounceVx = (dx / dist) * speed;
        p.bounceVy = -Math.abs(dy) * 0.03 - 4 - Math.random() * 3;  // arc upward
        p.reassemblePhase = 1;
      }

      // Bounce toward target with gravity
      p.bounceVy += 0.3;
      p.x += p.bounceVx;
      p.y += p.bounceVy;

      // Check if close to target
      const dx2 = t.x - p.x;
      const dy2 = t.y - p.y;
      const d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

      if (d2 < 3) {
        // Snap to target
        p.x = t.x;
        p.y = t.y;
        p.bounceVx = 0;
        p.bounceVy = 0;
        p.reassemblePhase = 2;  // done
      } else if (p.y > t.y && p.reassemblePhase === 1) {
        // Overshoot below target → bounce up toward it
        p.y = t.y;
        p.bounceVy = -Math.abs(p.bounceVy) * 0.4;
        p.bounceVx = dx2 * 0.1;
        if (Math.abs(p.bounceVy) < 0.5) {
          p.x = t.x; p.y = t.y;
          p.bounceVx = 0; p.bounceVy = 0;
          p.reassemblePhase = 2;
        }
      }

      p.color = t.color;
      p.r += (t.r - p.r) * 0.15;
      if (p.reassemblePhase < 2) allDone = false;
    }

    if (allDone || scatterTimer > 4500) {
      char.state = STATE.IDLE;
      char.stateTimer = 0;
      char.nextActionTime = time + 1000 + Math.random() * 2000;
      particles = [];
    }
    return;
  }

  if (time > char.nextActionTime) pickNextAction(time);

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.legPhase = 0;
      break;
    case STATE.WALK:
      char.legPhase += dt * 0.01 * Math.abs(char.vx);
      break;
    case STATE.JUMP_PREP:
      char.crouch += (12 - char.crouch) * 0.12;
      char.vx *= 0.95;
      if (char.stateTimer > 300) {
        char.state = STATE.JUMP;
        char.stateTimer = 0;
        char.vy = -(8 + Math.random() * 3);
        char.vx = (Math.random() - 0.5) * 2.5;
        char.crouch = -6;
        char.crouchV = -3;
      }
      break;
    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      char.crouch += (0 - char.crouch) * 0.08;
      if (char.y >= base) {
        char.y = base;
        const impactV = char.vy;
        char.vy = 0;
        char.crouch = 0;
        char.crouchV = impactV * 1.2;
        char.jellyV = impactV * 0.8;
        char.state = STATE.LANDING;
        char.stateTimer = 0;
      }
      break;
    case STATE.LANDING:
      if (char.stateTimer > 300 && Math.abs(char.crouch) < 2 && Math.abs(char.crouchV) < 2) {
        char.state = STATE.IDLE;
        char.crouch = 0; char.crouchV = 0;
        char.nextActionTime = time + 500 + Math.random() * 1500;
      }
      char.vx *= 0.92;
      break;
  }

  // Crouch spring
  if (char.state !== STATE.JUMP_PREP) {
    char.crouchV -= char.crouch * 0.2;
    char.crouchV *= 0.82;
    char.crouch += char.crouchV;
    if (Math.abs(char.crouch) < 0.2 && Math.abs(char.crouchV) < 0.2 && char.state !== STATE.LANDING) {
      char.crouch = 0; char.crouchV = 0;
    }
  }

  // Feed walk bob into jelly
  if (char.state === STATE.WALK) {
    const bobAccel = -char.walkBlend * Math.sin(char.legPhase * 2) * 0.15 * Math.abs(char.vx);
    char.jellyV += bobAccel;
  }

  // Jelly spring
  char.jellyV -= char.jellyD * 0.25;
  char.jellyV *= 0.78;
  char.jellyD += char.jellyV;
  if (Math.abs(char.jellyD) < 0.1 && Math.abs(char.jellyV) < 0.1) {
    char.jellyD = 0; char.jellyV = 0;
  }

  // Walk blend
  if (char.state === STATE.WALK) {
    char.walkBlend += (1 - char.walkBlend) * 0.08;
  } else {
    char.walkBlend = 0;
  }

  char.x += char.vx;
  const margin = 50;
  if (char.x < margin) {
    char.x = margin; char.vx = Math.abs(char.vx); char.dir = 1;
  } else if (char.x > canvas.width - margin) {
    char.x = canvas.width - margin; char.vx = -Math.abs(char.vx); char.dir = -1;
  }
  if (char.state !== STATE.JUMP) char.y = base;
  if (char.state === STATE.LANDING) char.vx *= 0.95;

  char.stateTimer += dt;
}

// ─── Draw ───
function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // If scattering or reassembling, draw particles
  if (char.state === STATE.SCATTER || char.state === STATE.REASSEMBLE) {
    for (const p of particles) {
      dot(p.x, p.y, p.r, p.color);
    }
    return;
  }

  // Normal drawing
  const targets = computeDotTargets();
  for (const t of targets) {
    dot(t.x, t.y, t.r, t.color);
  }
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
