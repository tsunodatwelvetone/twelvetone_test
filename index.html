<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP: 2 };

const char = {
  x: 0,
  y: 0,
  baseY: 0,
  vx: 0,
  vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  bodyW: 65,
  bodyH: 50,
  squish: 0,
  squishV: 0,
  eyeBlink: 0,
  eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  legLift: 0,
};

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  const r = Math.random();
  if (r < 0.35) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.75) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP;
    char.stateTimer = 0;
    char.vy = -(7 + Math.random() * 3);
    char.vx = (Math.random() - 0.5) * 2.5;
    char.nextActionTime = time + 2000;
  }
}

// ─── Update ───
function update(time, dt) {
  if (time > char.nextActionTime) {
    pickNextAction(time);
  }

  const base = groundY();
  char.baseY = base;

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  // Physics
  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.squish = Math.sin(time * 0.003) * 0.03;
      break;

    case STATE.WALK:
      char.legPhase += dt * 0.008 * Math.abs(char.vx);
      char.squish = Math.sin(char.legPhase * 2) * 0.02;
      break;

    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      char.squish = Math.sin(time * 0.015) * 0.1 + (char.vy < 0 ? -0.06 : 0.06);
      if (char.y >= base) {
        char.y = base;
        char.vy = 0;
        char.squishV = 0.3;
        char.state = STATE.IDLE;
        char.nextActionTime = time + 800 + Math.random() * 1500;
      }
      break;
  }

  // Squish spring
  char.squishV *= 0.9;
  char.squish += char.squishV;
  char.squishV -= char.squish * 0.12;

  // Move
  char.x += char.vx;

  // Wrap around screen
  if (char.x < -80) char.x = canvas.width + 80;
  if (char.x > canvas.width + 80) char.x = -80;

  // Keep on ground
  if (char.state !== STATE.JUMP) {
    char.y = base;
  }

  // Leg lift
  let legLiftTarget = (char.state === STATE.WALK) ? 18 : 0;
  char.legLift += (legLiftTarget - char.legLift) * 0.08;

  char.stateTimer += dt;
}

// ─── Draw (48 dots only) ───
function dot(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bx = char.x;
  const by = char.y - (char.legLift || 0);
  const bw = char.bodyW;  // 65 (half-width)
  const bh = char.bodyH;  // 50 (half-height) → ratio 1.3:1
  const sq = char.squish;

  const sw = bw * (1 + sq * 0.5);
  const sh = bh * (1 - sq);

  // === 48 dots total ===

  // ─── Shadow: 3 dots ───
  const shadowScale = Math.max(0.3, 1 - (char.baseY - char.y) * 0.004);
  const shadowA = 0.08 * shadowScale;
  const sY = char.baseY + sh * 0.45;
  dot(bx - 18 * shadowScale, sY, 14 * shadowScale, '#000', shadowA);
  dot(bx, sY, 18 * shadowScale, '#000', shadowA);
  dot(bx + 18 * shadowScale, sY, 14 * shadowScale, '#000', shadowA);

  // ─── Legs: 4 dots (2 per leg, short & close together) ───
  // Leg spacing ~20% of body width, short length ~25% of body height
  const legSpacing = sw * 0.2;
  for (let side = -1; side <= 1; side += 2) {
    const legX = bx + side * legSpacing;
    const legTopY = by + sh * 0.32;
    let fxOff = 0, kickUp = 0;
    if (char.state === STATE.WALK) {
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      fxOff = Math.sin(phase) * 5;
      kickUp = Math.abs(Math.sin(phase)) * 5;
    }
    dot(legX, legTopY + 5, 5, '#e86818');
    dot(legX + fxOff, legTopY + 14 - kickUp, 5.5, '#f07020');
  }

  // ─── Body: 28 dots (overlapping orange circles, oval 1.3:1) ───
  // Outer ring (14 dots) - defines the oval silhouette
  for (let i = 0; i < 14; i++) {
    const a = (Math.PI * 2 * i) / 14;
    const rx = sw * 0.75;
    const ry = sh * 0.65;
    dot(bx + Math.cos(a) * rx, by + Math.sin(a) * ry, 24, '#f07820');
  }
  // Mid ring (8 dots) - fills interior
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i) / 8 + 0.25;
    const rx = sw * 0.35;
    const ry = sh * 0.3;
    dot(bx + Math.cos(a) * rx, by + Math.sin(a) * ry, 22, '#f48030');
  }
  // Center fill (4 dots)
  dot(bx, by, 26, '#f58535');
  dot(bx, by - sh * 0.18, 20, '#f88e40');
  dot(bx - sw * 0.18, by + sh * 0.08, 18, '#f07520');
  dot(bx + sw * 0.18, by + sh * 0.08, 18, '#f07520');
  // Highlight - upper left glossy shine (2 dots)
  dot(bx - sw * 0.25, by - sh * 0.38, 14, '#ffa050', 0.55);
  dot(bx - sw * 0.15, by - sh * 0.48, 9, '#ffcc90', 0.35);

  // ─── Eye: 8 dots (large, ~35% of body width, centered on body) ───
  const eyeX = bx + char.dir * 3;  // very slight offset
  const eyeY = by - sh * 0.02;     // vertically centered
  const eyeR = sw * 0.175;         // ~35% of body width diameter

  if (char.eyeBlink) {
    // Blink: flat line using 2 dots
    dot(eyeX - 5, eyeY, 4, '#fff');
    dot(eyeX + 5, eyeY, 4, '#fff');
    for (let i = 0; i < 6; i++) { dot(eyeX, eyeY, 0.1, '#fff', 0); }
  } else {
    // Eye white (4 dots overlapping to make a circle)
    dot(eyeX, eyeY - 3, eyeR, '#fff');
    dot(eyeX, eyeY + 3, eyeR, '#fff');
    dot(eyeX - 3, eyeY, eyeR * 0.85, '#fff');
    dot(eyeX + 3, eyeY, eyeR * 0.85, '#fff');
    // Pupil (2 dots) - centered with slight movement
    const px = char.vx * 1.2;
    const py = char.state === STATE.JUMP ? -2 : 0.5;
    dot(eyeX + px, eyeY + py, 7, '#111');
    dot(eyeX + px, eyeY + py + 0.5, 5.5, '#1a1a1a');
    // Shine (1 dot)
    dot(eyeX + px + 3, eyeY + py - 3.5, 2.5, '#fff');
    // Subtle iris edge (1 dot)
    dot(eyeX + px - 1.5, eyeY + py + 2.5, 3, '#333', 0.25);
  }

  // ─── Accent: 5 dots ───
  if (char.state === STATE.JUMP && char.vy < 0) {
    // Jump sparkles
    for (let i = 0; i < 5; i++) {
      dot(
        bx + (Math.random() - 0.5) * sw * 1.2,
        by + sh * 0.4 + Math.random() * sh * 0.3,
        1.5 + Math.random() * 2,
        '#ffa040', 0.2 + Math.random() * 0.15
      );
    }
  } else {
    // Body shading accents - subtle depth
    dot(bx + sw * 0.35, by + sh * 0.15, 10, '#e06515', 0.35);
    dot(bx - sw * 0.35, by + sh * 0.2, 10, '#e06515', 0.3);
    dot(bx, by + sh * 0.35, 12, '#e06515', 0.25);
    // Top highlight accents
    dot(bx + sw * 0.1, by - sh * 0.42, 7, '#ffb060', 0.3);
    dot(bx - sw * 0.35, by - sh * 0.15, 8, '#ffa050', 0.2);
  }

  // Total: 3 + 4 + 14 + 8 + 4 + 2 + 8 + 5 = 48
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
