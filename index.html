<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP: 2 };

const char = {
  x: 0, y: 0, baseY: 0,
  vx: 0, vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  eyeBlink: 0, eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  crouch: 0,     // landing knee-bend amount
  crouchV: 0,    // crouch velocity (spring)
  walkBlend: 0,  // smooth walk transition
};

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  const r = Math.random();
  if (r < 0.35) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.75) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP;
    char.stateTimer = 0;
    char.vy = -(7 + Math.random() * 3);
    char.vx = (Math.random() - 0.5) * 2.5;
    char.nextActionTime = time + 2000;
  }
}

// ─── Update ───
function update(time, dt) {
  if (time > char.nextActionTime) pickNextAction(time);

  const base = groundY();
  char.baseY = base;

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      break;
    case STATE.WALK:
      // Phase speed tuned so stance foot matches ground speed
      char.legPhase += dt * 0.01 * Math.abs(char.vx);
      break;
    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      if (char.y >= base) {
        char.y = base;
        char.vy = 0;
        char.crouchV = 12;  // landing impact → knees absorb
        char.state = STATE.IDLE;
        char.nextActionTime = time + 800 + Math.random() * 1500;
      }
      break;
  }

  // Crouch spring (landing knee absorption)
  char.crouchV -= char.crouch * 0.2;
  char.crouchV *= 0.82;
  char.crouch += char.crouchV;
  if (Math.abs(char.crouch) < 0.3 && Math.abs(char.crouchV) < 0.3) {
    char.crouch = 0; char.crouchV = 0;
  }

  // Walk blend (smooth in/out)
  const wTarget = char.state === STATE.WALK ? 1 : 0;
  char.walkBlend += (wTarget - char.walkBlend) * 0.08;

  char.x += char.vx;
  if (char.x < -100) char.x = canvas.width + 100;
  if (char.x > canvas.width + 100) char.x = -100;
  if (char.state !== STATE.JUMP) char.y = base;

  char.stateTimer += dt;
}

// ─── Draw ───
function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const R = 8;            // smaller dots → more dots → rounder body
  const ORANGE = '#f07820';
  const L = 12;           // short leg segments (game character proportions)

  const bx = char.x;
  const ground = char.y;
  const crouch = Math.max(0, char.crouch);

  // Body ellipse (rounder game-character shape)
  const squash = crouch * 0.008;
  const bodyRx = 42 * (1 + squash);       // wider on landing squash
  const bodyRy = 34 * (1 - squash * 0.6); // shorter on landing squash

  // Hip near body bottom; short legs below
  const standH = L * 1.85;
  const hipY = ground - standH + crouch;

  // Body bob during walk
  const wb = char.walkBlend;
  const bob = wb * Math.abs(Math.sin(char.legPhase)) * 2;
  const bodyY = hipY - bodyRy + 6 - bob;

  // ─── Legs (3 dots each, 2-bone IK with knee) ───
  const hipSpacing = 10;
  const stanceLen = 9;  // tuned to match ground speed

  for (let side = -1; side <= 1; side += 2) {
    const hx = bx + side * hipSpacing;
    const hy = hipY;
    let fx, fy;

    if (char.state === STATE.JUMP) {
      // Tuck legs when ascending, extend when falling
      const tuck = char.vy < 0 ? Math.abs(char.vy) * 0.3 : 0;
      fx = hx;
      fy = hy + L * 1.8 - tuck;
    } else {
      // Piecewise walk: swing (in air) + stance (on ground)
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      const p = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

      if (wb < 0.01) {
        // Idle: feet straight down
        fx = hx;
        fy = ground;
      } else if (p < Math.PI) {
        // Swing phase: foot lifts and arcs forward
        const t = p / Math.PI;
        const swingX = (-stanceLen + t * 2 * stanceLen) * wb;
        const swingY = Math.sin(t * Math.PI) * 8 * wb;
        fx = hx + swingX;
        fy = ground - swingY;
      } else {
        // Stance phase: foot on ground, slides backward (matches body movement)
        const t = (p - Math.PI) / Math.PI;
        const stanceX = (stanceLen - t * 2 * stanceLen) * wb;
        fx = hx + stanceX;
        fy = ground;
      }
    }

    // 2-bone IK for knee
    const dx = fx - hx, dy = fy - hy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const d = Math.min(dist, L * 2 - 0.1);

    let kx, ky;
    if (d < 1) {
      kx = hx + side * L * 0.5;
      ky = hy + L * 0.87;
    } else {
      const cosA = Math.max(-1, Math.min(1, d / (2 * L)));
      const a = Math.acos(cosA);
      const baseAng = Math.atan2(dy, dx);
      // Walk: bend knees forward; idle/landing: bend outward
      const bendDir = wb > 0.5 ? char.dir : -side;
      const kneeAng = baseAng - bendDir * a;
      kx = hx + Math.cos(kneeAng) * L;
      ky = hy + Math.sin(kneeAng) * L;
    }

    dot(hx, hy, R, ORANGE);
    dot(kx, ky, R, ORANGE);
    dot(fx, fy, R, ORANGE);
  }

  // ─── Body (hex-packed, dense, opaque — drawn OVER leg tops) ───
  const step = R * 1.25;
  const maxRow = Math.ceil(bodyRy / step);
  const maxCol = Math.ceil(bodyRx / step);

  for (let row = -maxRow; row <= maxRow; row++) {
    const cy = row * step;
    const xOff = (Math.abs(row) % 2 === 1) ? step / 2 : 0;
    for (let col = -maxCol; col <= maxCol; col++) {
      const cx = col * step + xOff;
      if ((cx * cx) / (bodyRx * bodyRx) + (cy * cy) / (bodyRy * bodyRy) <= 1) {
        dot(bx + cx, bodyY + cy, R, ORANGE);
      }
    }
  }

  // ─── Eye (upper-front of body, game-character style) ───
  const eyeX = bx + char.dir * bodyRx * 0.18;
  const eyeY = bodyY - bodyRy * 0.12;

  if (char.eyeBlink) {
    // Thin line blink
    dot(eyeX, eyeY, R * 0.6, '#fff');
  } else {
    dot(eyeX, eyeY, R * 2.0, '#fff');    // big white (game character big eye)
    const px = char.vx * 0.6;
    const py = char.state === STATE.JUMP ? -1 : 0;
    dot(eyeX + px, eyeY + py, R * 1.0, '#000'); // pupil
  }
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
