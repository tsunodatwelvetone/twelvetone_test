<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP: 2 };

const char = {
  x: 0,
  y: 0,
  baseY: 0,
  vx: 0,
  vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  bodyW: 65,
  bodyH: 50,
  squish: 0,
  squishV: 0,
  eyeBlink: 0,
  eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  legLift: 0,
};

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  const r = Math.random();
  if (r < 0.35) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.75) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP;
    char.stateTimer = 0;
    char.vy = -(7 + Math.random() * 3);
    char.vx = (Math.random() - 0.5) * 2.5;
    char.nextActionTime = time + 2000;
  }
}

// ─── Update ───
function update(time, dt) {
  if (time > char.nextActionTime) {
    pickNextAction(time);
  }

  const base = groundY();
  char.baseY = base;

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  // Physics
  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.squish = Math.sin(time * 0.003) * 0.03;
      break;

    case STATE.WALK:
      char.legPhase += dt * 0.008 * Math.abs(char.vx);
      char.squish = Math.sin(char.legPhase * 2) * 0.02;
      break;

    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      char.squish = Math.sin(time * 0.015) * 0.1 + (char.vy < 0 ? -0.06 : 0.06);
      if (char.y >= base) {
        char.y = base;
        char.vy = 0;
        char.squishV = 0.3;
        char.state = STATE.IDLE;
        char.nextActionTime = time + 800 + Math.random() * 1500;
      }
      break;
  }

  // Squish spring
  char.squishV *= 0.9;
  char.squish += char.squishV;
  char.squishV -= char.squish * 0.12;

  // Move
  char.x += char.vx;

  // Wrap around screen
  if (char.x < -80) char.x = canvas.width + 80;
  if (char.x > canvas.width + 80) char.x = -80;

  // Keep on ground
  if (char.state !== STATE.JUMP) {
    char.y = base;
  }

  // Leg lift
  let legLiftTarget = (char.state === STATE.WALK) ? 18 : 0;
  char.legLift += (legLiftTarget - char.legLift) * 0.08;

  char.stateTimer += dt;
}

// ─── Draw ───
function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bx = char.x;
  const by = char.y - (char.legLift || 0);
  const sq = char.squish;

  const sw = char.bodyW * (1 + sq * 0.5);
  const sh = char.bodyH * (1 - sq);

  const R = 11;       // standard dot radius (all dots except eye white)
  const D = R * 1.7;  // spacing between dot centers
  const ORANGE = '#f07820';

  // ─── Legs: 6 dots (3 per leg) ───
  const legSpacing = sw * 0.2;
  for (let side = -1; side <= 1; side += 2) {
    const legX = bx + side * legSpacing;
    const legTopY = by + sh * 0.3;
    let fxOff = 0, kickUp = 0;
    if (char.state === STATE.WALK) {
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      fxOff = Math.sin(phase) * 6;
      kickUp = Math.abs(Math.sin(phase)) * 6;
    }
    dot(legX, legTopY + 4, R, ORANGE);
    dot(legX + fxOff * 0.5, legTopY + 4 + D, R, ORANGE);
    dot(legX + fxOff, legTopY + 4 + D * 2 - kickUp, R, ORANGE);
  }

  // ─── Body: oval of uniform dots (1.3:1 ratio) ───
  // Outer ring (12 dots)
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12;
    dot(bx + Math.cos(a) * sw * 0.62, by + Math.sin(a) * sh * 0.55, R, ORANGE);
  }
  // Inner ring (6 dots)
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI * 2 * i) / 6 + 0.3;
    dot(bx + Math.cos(a) * sw * 0.28, by + Math.sin(a) * sh * 0.25, R, ORANGE);
  }
  // Center (1 dot)
  dot(bx, by, R, ORANGE);

  // ─── Eye ───
  const eyeX = bx + char.dir * 3;
  const eyeY = by - sh * 0.02;

  if (char.eyeBlink) {
    // Blink: just the white squished flat
    dot(eyeX, eyeY, R, '#fff');
  } else {
    // Eye white: 1 large dot
    dot(eyeX, eyeY, R * 1.6, '#fff');
    // Pupil: 1 standard-size dot (black)
    const px = char.vx * 1.2;
    const py = char.state === STATE.JUMP ? -2 : 0.5;
    dot(eyeX + px, eyeY + py, R, '#000');
  }
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
