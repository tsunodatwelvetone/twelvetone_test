<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP_PREP: 2, JUMP: 3, LANDING: 4 };

const char = {
  x: 0, y: 0, baseY: 0,
  vx: 0, vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  eyeBlink: 0, eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  crouch: 0,     // knee-bend amount (positive = crouching)
  crouchV: 0,    // crouch velocity (spring)
  walkBlend: 0,  // smooth walk transition
  jellyV: 0,     // jelly vertical velocity for body deformation
  jellyD: 0,     // jelly deformation amount
};

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  const r = Math.random();
  if (r < 0.35) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.75) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP_PREP;
    char.stateTimer = 0;
    char.crouch = 0;
    char.crouchV = 0;
    char.vx *= 0.3;
    char.nextActionTime = time + 3000;  // will be overridden by jump launch
  }
}

// ─── Update ───
function update(time, dt) {
  if (time > char.nextActionTime) pickNextAction(time);

  const base = groundY();
  char.baseY = base;

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.legPhase = 0;  // reset leg phase so legs are straight
      break;
    case STATE.WALK:
      char.legPhase += dt * 0.01 * Math.abs(char.vx);
      break;
    case STATE.JUMP_PREP:
      // Squat down over ~300ms then launch
      char.crouch += (12 - char.crouch) * 0.12;
      char.vx *= 0.95;
      if (char.stateTimer > 300) {
        char.state = STATE.JUMP;
        char.stateTimer = 0;
        char.vy = -(8 + Math.random() * 3);
        char.vx = (Math.random() - 0.5) * 2.5;
        char.crouch = -6;  // negative = stretch on launch
        char.crouchV = -3;
      }
      break;
    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      // Slowly relax crouch toward 0 in air (legs extended)
      char.crouch += (0 - char.crouch) * 0.08;
      if (char.y >= base) {
        char.y = base;
        const impactV = char.vy;
        char.vy = 0;
        char.crouch = 0;
        char.crouchV = impactV * 1.2;  // landing impact proportional to fall speed
        char.jellyV = impactV * 0.8;   // jelly squash on landing
        char.state = STATE.LANDING;
        char.stateTimer = 0;
      }
      break;
    case STATE.LANDING:
      // Stay in landing until crouch spring settles
      if (char.stateTimer > 300 && Math.abs(char.crouch) < 2 && Math.abs(char.crouchV) < 2) {
        char.state = STATE.IDLE;
        char.crouch = 0; char.crouchV = 0;  // snap legs straight immediately
        char.nextActionTime = time + 500 + Math.random() * 1500;
      }
      char.vx *= 0.92;
      break;
  }

  // Crouch spring (used by jump prep, landing, walk bob)
  if (char.state !== STATE.JUMP_PREP) {
    char.crouchV -= char.crouch * 0.2;
    char.crouchV *= 0.82;
    char.crouch += char.crouchV;
    if (Math.abs(char.crouch) < 0.2 && Math.abs(char.crouchV) < 0.2 && char.state !== STATE.LANDING) {
      char.crouch = 0; char.crouchV = 0;
    }
  }

  // Feed walk bob into jelly
  if (char.state === STATE.WALK) {
    const bobAccel = -char.walkBlend * Math.sin(char.legPhase * 2) * 0.15 * Math.abs(char.vx);
    char.jellyV += bobAccel;
  }

  // Jelly spring (body deformation)
  char.jellyV -= char.jellyD * 0.25;
  char.jellyV *= 0.78;
  char.jellyD += char.jellyV;
  if (Math.abs(char.jellyD) < 0.1 && Math.abs(char.jellyV) < 0.1) {
    char.jellyD = 0; char.jellyV = 0;
  }

  // Walk blend (smooth in, snap out)
  if (char.state === STATE.WALK) {
    char.walkBlend += (1 - char.walkBlend) * 0.08;
  } else {
    char.walkBlend = 0;  // snap legs straight immediately on stop
  }

  char.x += char.vx;
  const margin = 50; // body radius + padding
  if (char.x < margin) {
    char.x = margin;
    char.vx = Math.abs(char.vx);
    char.dir = 1;
  } else if (char.x > canvas.width - margin) {
    char.x = canvas.width - margin;
    char.vx = -Math.abs(char.vx);
    char.dir = -1;
  }
  if (char.state !== STATE.JUMP) char.y = base;
  // Prevent drifting during landing
  if (char.state === STATE.LANDING) char.vx *= 0.95;

  char.stateTimer += dt;
}

// ─── Draw ───
function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const R = 7;            // leg dot radius
  const BR = 14;          // body dot radius (big bold dots)
  const ORANGE = '#f07820';
  const L = 11;           // short leg segments (cute game proportions)

  const bx = char.x;
  const ground = char.y;
  const wb = char.walkBlend;

  // Body ellipse with jelly deformation
  // Positive squash = wider+shorter, negative = taller+narrower
  const squashAmt = char.crouch * 0.006 + char.jellyD * 0.008;
  const bodyRx = 44 * (1 + squashAmt);
  const bodyRy = 34 * (1 - squashAmt * 0.7);

  // Standing leg height
  const standH = L * 1.96;

  // Walk bob: body drops at contact, rises at mid-stance (bigger amplitude)
  const walkBob = wb * Math.cos(char.legPhase * 2) * 3.5;

  const crouchOffset = Math.max(0, char.crouch);
  const hipY = ground - standH + crouchOffset + walkBob;
  const bodyY = hipY - bodyRy + 5;

  // ─── Legs (3 dots each, 2-bone IK, knees always outward) ───
  const hipSpacing = 9;
  const stanceLen = 9;

  for (let side = -1; side <= 1; side += 2) {
    const hx = bx + side * hipSpacing;
    const hy = hipY;
    let fx, fy;

    if (char.state === STATE.JUMP_PREP) {
      // Crouching: feet on ground, knees bent outward
      fx = hx + side * 4;
      fy = ground;
    } else if (char.state === STATE.JUMP) {
      // Airborne: legs stretched straight down, extended longer
      const stretch = 1.0 + 0.25 * Math.max(0, -char.vy / 10);  // stretch more on upward
      fx = hx;
      fy = hy + L * 2.1 * stretch;
    } else if (char.state === STATE.LANDING) {
      // Landing: feet on ground, knees bent for absorption
      fx = hx + side * 3;
      fy = ground;
    } else if (wb < 0.01) {
      // Idle: legs perfectly straight down
      fx = hx;
      fy = ground;
    } else {
      // Walk: swing/stance phases, stride follows travel direction
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      const p = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

      if (p < Math.PI) {
        // Swing: foot arcs forward (in char.dir direction)
        const t = p / Math.PI;
        fx = hx + (-stanceLen + t * 2 * stanceLen) * wb * char.dir;
        fy = ground - Math.sin(t * Math.PI) * 7 * wb;
      } else {
        // Stance: foot on ground, pushes backward
        const t = (p - Math.PI) / Math.PI;
        fx = hx + (stanceLen - t * 2 * stanceLen) * wb * char.dir;
        fy = ground;
      }
    }

    // 2-bone IK — knees ALWAYS bend outward (side determines direction)
    const dx = fx - hx, dy = fy - hy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const d = Math.min(dist, L * 2 - 0.1);

    let kx, ky;
    if (char.state === STATE.JUMP) {
      // Airborne: legs straight, knee is midpoint
      kx = (hx + fx) / 2;
      ky = (hy + fy) / 2;
    } else if (wb < 0.01 && char.state === STATE.IDLE) {
      // Idle: perfectly straight legs — knee is midpoint
      kx = (hx + fx) / 2;
      ky = (hy + fy) / 2;
    } else if (d < 1) {
      kx = hx + side * L * 0.7;
      ky = hy + L * 0.7;
    } else {
      const cosA = Math.max(-1, Math.min(1, d / (2 * L)));
      const a = Math.acos(cosA);
      const baseAng = Math.atan2(dy, dx);
      // side: right leg bends right, left leg bends left (outward)
      const kneeAng = baseAng - side * a;
      kx = hx + Math.cos(kneeAng) * L;
      ky = hy + Math.sin(kneeAng) * L;
    }

    dot(hx, hy, R, ORANGE);
    dot(kx, ky, R, ORANGE);
    dot(fx, fy, R, ORANGE);
  }

  // ─── Body (concentric elliptical rings — perfectly round outline) ───
  const ringGap = BR * 1.0;
  const numRings = Math.ceil(Math.min(bodyRx, bodyRy) / ringGap);

  for (let i = numRings; i >= 0; i--) {
    const scale = i / numRings;
    const rx = bodyRx * scale;
    const ry = bodyRy * scale;

    if (rx < 1 && ry < 1) {
      dot(bx, bodyY, BR, ORANGE);
    } else {
      const circ = 2 * Math.PI * Math.max(rx, ry);
      const n = Math.max(1, Math.round(circ / (BR * 1.5)));
      const angOff = (i % 2 === 0) ? 0 : Math.PI / n;
      for (let j = 0; j < n; j++) {
        const a = (Math.PI * 2 * j) / n + angOff;
        dot(bx + Math.cos(a) * rx, bodyY + Math.sin(a) * ry, BR, ORANGE);
      }
    }
  }

  // ─── Eye (upper-front of body) ───
  const eyeX = bx + char.dir * bodyRx * 0.2;
  const eyeY = bodyY - bodyRy * 0.1;

  if (char.eyeBlink) {
    dot(eyeX, eyeY, R * 0.7, '#fff');
  } else {
    dot(eyeX, eyeY, R * 2.2, '#fff');    // big white
    const px = char.vx * 0.5;
    const py = char.state === STATE.JUMP ? -1 : 0;
    dot(eyeX + px, eyeY + py, R * 1.1, '#000'); // pupil
  }
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
