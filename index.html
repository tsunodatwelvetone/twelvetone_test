<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP: 2 };

const char = {
  x: 0,
  y: 0,
  baseY: 0,
  vx: 0,
  vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  bodyW: 60,
  bodyH: 50,
  squish: 0,
  squishV: 0,
  eyeBlink: 0,
  eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  legLift: 0,
};

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  const r = Math.random();
  if (r < 0.35) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.75) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP;
    char.stateTimer = 0;
    char.vy = -(7 + Math.random() * 3);
    char.vx = (Math.random() - 0.5) * 2.5;
    char.nextActionTime = time + 2000;
  }
}

// ─── Update ───
function update(time, dt) {
  if (time > char.nextActionTime) {
    pickNextAction(time);
  }

  const base = groundY();
  char.baseY = base;

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  // Physics
  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.squish = Math.sin(time * 0.003) * 0.03;
      break;

    case STATE.WALK:
      char.legPhase += dt * 0.008 * Math.abs(char.vx);
      char.squish = Math.sin(char.legPhase * 2) * 0.02;
      break;

    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      char.squish = Math.sin(time * 0.015) * 0.1 + (char.vy < 0 ? -0.06 : 0.06);
      if (char.y >= base) {
        char.y = base;
        char.vy = 0;
        char.squishV = 0.3;
        char.state = STATE.IDLE;
        char.nextActionTime = time + 800 + Math.random() * 1500;
      }
      break;
  }

  // Squish spring
  char.squishV *= 0.9;
  char.squish += char.squishV;
  char.squishV -= char.squish * 0.12;

  // Move
  char.x += char.vx;

  // Wrap around screen
  if (char.x < -80) char.x = canvas.width + 80;
  if (char.x > canvas.width + 80) char.x = -80;

  // Keep on ground
  if (char.state !== STATE.JUMP) {
    char.y = base;
  }

  // Leg lift
  let legLiftTarget = (char.state === STATE.WALK) ? 18 : 0;
  char.legLift += (legLiftTarget - char.legLift) * 0.08;

  char.stateTimer += dt;
}

// ─── Draw (48 dots only) ───
function dot(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bx = char.x;
  const by = char.y - (char.legLift || 0);
  const bw = char.bodyW;
  const bh = char.bodyH;
  const sq = char.squish;

  const sw = bw * (1 + sq * 0.5);
  const sh = bh * (1 - sq);

  // === 48 dots total ===
  let n = 0;

  // ─── Shadow: 3 dots ───
  const shadowScale = Math.max(0.3, 1 - (char.baseY - char.y) * 0.004);
  const shadowA = 0.1 * shadowScale;
  const sY = char.baseY + sh * 0.55;
  dot(bx - 16 * shadowScale, sY, 10 * shadowScale, '#000', shadowA); n++;
  dot(bx, sY, 12 * shadowScale, '#000', shadowA); n++;
  dot(bx + 16 * shadowScale, sY, 10 * shadowScale, '#000', shadowA); n++;

  // ─── Legs: 6 dots (3 per leg) ───
  for (let side = -1; side <= 1; side += 2) {
    const legX = bx + side * 14;
    const legTopY = by + sh * 0.3;
    let fxOff = 0, kickUp = 0;
    if (char.state === STATE.WALK) {
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      fxOff = Math.sin(phase) * 7;
      kickUp = Math.abs(Math.sin(phase)) * 6;
    }
    dot(legX, legTopY + 4, 5, '#e06515'); n++;
    dot(legX + fxOff * 0.5, legTopY + 10 - kickUp * 0.5, 5, '#f07020'); n++;
    dot(legX + fxOff, legTopY + 16 - kickUp, 5.5, '#f07a28'); n++;
  }

  // ─── Body: 26 dots (overlapping orange circles) ───
  // Outer ring (12 dots)
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12;
    const rx = sw * 0.72;
    const ry = sh * 0.62;
    dot(bx + Math.cos(a) * rx, by + Math.sin(a) * ry, 22, '#f07820'); n++;
  }
  // Mid ring (8 dots)
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i) / 8 + 0.2;
    const rx = sw * 0.38;
    const ry = sh * 0.35;
    dot(bx + Math.cos(a) * rx, by + Math.sin(a) * ry, 20, '#f48030'); n++;
  }
  // Center fill (4 dots)
  dot(bx, by, 24, '#f58535'); n++;
  dot(bx, by - sh * 0.15, 18, '#f88e40'); n++;
  dot(bx - sw * 0.15, by + sh * 0.1, 16, '#f07520'); n++;
  dot(bx + sw * 0.15, by + sh * 0.1, 16, '#f07520'); n++;
  // Highlight (2 dots)
  dot(bx - sw * 0.2, by - sh * 0.35, 12, '#ffa050', 0.6); n++;
  dot(bx - sw * 0.12, by - sh * 0.45, 8, '#ffcc90', 0.4); n++;

  // ─── Eye: 8 dots ───
  const eyeX = bx + char.dir * 6;
  const eyeY = by - sh * 0.05;

  if (char.eyeBlink) {
    // Blink: 2 dots as squished eye + 6 invisible (still count)
    dot(eyeX - 4, eyeY, 5, '#fff'); n++;
    dot(eyeX + 4, eyeY, 5, '#fff'); n++;
    // Use remaining 6 eye dots as tiny hidden ones
    for (let i = 0; i < 6; i++) { dot(eyeX, eyeY, 0.5, '#fff', 0); n++; }
  } else {
    // Eye white (4 dots)
    dot(eyeX, eyeY - 3, 11, '#fff'); n++;
    dot(eyeX, eyeY + 3, 11, '#fff'); n++;
    dot(eyeX - 4, eyeY, 9, '#fff'); n++;
    dot(eyeX + 4, eyeY, 9, '#fff'); n++;
    // Pupil (2 dots)
    const px = char.vx * 1.5;
    const py = char.state === STATE.JUMP ? -2 : 1;
    dot(eyeX + px, eyeY + py, 6.5, '#111'); n++;
    dot(eyeX + px, eyeY + py + 1, 5, '#222'); n++;
    // Shine (1 dot)
    dot(eyeX + px + 3, eyeY + py - 3, 2.5, '#fff'); n++;
    // Iris edge (1 dot)
    dot(eyeX + px - 2, eyeY + py + 2, 3, '#333', 0.3); n++;
  }

  // ─── Jump sparkles: 2 dots ───
  if (char.state === STATE.JUMP && char.vy < 0) {
    dot(bx + (Math.random() - 0.5) * bw, by + bh * 0.5, 2 + Math.random() * 2, '#ffa040', 0.35); n++;
    dot(bx + (Math.random() - 0.5) * bw, by + bh * 0.55, 1.5 + Math.random() * 2, '#ffb060', 0.3); n++;
  } else {
    // Idle/walk: 2 extra body accent dots
    dot(bx + sw * 0.3, by - sh * 0.2, 8, '#e86818', 0.5); n++;
    dot(bx - sw * 0.3, by + sh * 0.15, 8, '#e86818', 0.4); n++;
  }

  // n should be exactly 48
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
