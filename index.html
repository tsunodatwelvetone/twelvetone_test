<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Character</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Character State ───
const STATE = { IDLE: 0, WALK: 1, JUMP_PREP: 2, JUMP: 3, LANDING: 4, SCATTER: 5, REASSEMBLE: 6 };

const char = {
  x: 0, y: 0, baseY: 0,
  vx: 0, vy: 0,
  state: STATE.IDLE,
  stateTimer: 0,
  eyeBlink: 0, eyeBlinkTimer: 0,
  legPhase: 0,
  dir: 1,
  nextActionTime: 0,
  crouch: 0,
  crouchV: 0,
  walkBlend: 0,
  jellyV: 0,
  jellyD: 0,
};

// ─── Particle System ───
let particles = [];
let scatterTimer = 0;

function initChar() {
  char.x = canvas.width / 2;
  char.baseY = canvas.height * 0.55;
  char.y = char.baseY;
}
initChar();

function groundY() {
  return canvas.height * 0.55;
}

// ─── AI / Behavior ───
function pickNextAction(time) {
  if (char.state === STATE.SCATTER || char.state === STATE.REASSEMBLE) return;

  const r = Math.random();
  if (r < 0.12) {
    // Scatter!
    startScatter(time);
  } else if (r < 0.42) {
    char.state = STATE.IDLE;
    char.stateTimer = 0;
    char.nextActionTime = time + 2000 + Math.random() * 3000;
    char.vx = 0;
  } else if (r < 0.72) {
    char.state = STATE.WALK;
    char.stateTimer = 0;
    char.dir = Math.random() < 0.5 ? -1 : 1;
    char.vx = char.dir * (1.0 + Math.random() * 1.2);
    char.nextActionTime = time + 1500 + Math.random() * 3000;
  } else {
    char.state = STATE.JUMP_PREP;
    char.stateTimer = 0;
    char.crouch = 0;
    char.crouchV = 0;
    char.vx *= 0.3;
    char.nextActionTime = time + 3000;
  }
}

function startScatter(time) {
  // Compute current dot targets so we know how many particles
  const targets = computeDotTargets();
  particles = targets.map(t => ({
    // Current position = target position at scatter start
    x: t.x, y: t.y, r: t.r, color: t.color,
    // Velocities: burst outward + some upward
    vx: (Math.random() - 0.5) * 8 + (t.x - char.x) * 0.08,
    vy: -(2 + Math.random() * 5),
    // Target to return to (relative to char position at reassemble time)
    tx: t.x - char.x, ty: t.y - char.y,
    onGround: false,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 0.3,
  }));
  char.state = STATE.SCATTER;
  char.stateTimer = 0;
  char.vx = 0;
  scatterTimer = 0;
}

// ─── Compute dot target positions (extracted from draw logic) ───
function computeDotTargets() {
  const R = 7;
  const BR = 14;
  const ORANGE = '#f07820';
  const L = 11;
  const dots = [];

  const bx = char.x;
  const ground = char.y;
  const wb = char.walkBlend;

  const squashAmt = char.crouch * 0.006 + char.jellyD * 0.008;
  const bodyRx = 44 * (1 + squashAmt);
  const bodyRy = 34 * (1 - squashAmt * 0.7);
  const standH = L * 1.96;
  const walkBob = wb * Math.cos(char.legPhase * 2) * 3.5;
  const crouchOffset = Math.max(0, char.crouch);
  const hipY = ground - standH + crouchOffset + walkBob;
  const bodyY = hipY - bodyRy + 5;

  const hipSpacing = 9;
  const stanceLen = 9;

  // Legs
  for (let side = -1; side <= 1; side += 2) {
    const hx = bx + side * hipSpacing;
    const hy = hipY;
    let fx, fy;
    const restSpacing = stanceLen * 0.7;

    if (char.state === STATE.JUMP_PREP) {
      fx = hx + side * restSpacing; fy = ground;
    } else if (char.state === STATE.JUMP) {
      const stretch = 1.0 + 0.25 * Math.max(0, -char.vy / 10);
      fx = hx + side * restSpacing; fy = hy + L * 2.1 * stretch;
    } else if (char.state === STATE.LANDING) {
      fx = hx + side * restSpacing; fy = ground;
    } else if (wb < 0.01) {
      fx = hx + side * restSpacing; fy = ground;
    } else {
      const phase = char.legPhase + (side === 1 ? Math.PI : 0);
      const p = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      if (p < Math.PI) {
        const t = p / Math.PI;
        fx = hx + (-stanceLen + t * 2 * stanceLen) * wb * char.dir;
        fy = ground - Math.sin(t * Math.PI) * 7 * wb;
      } else {
        const t = (p - Math.PI) / Math.PI;
        fx = hx + (stanceLen - t * 2 * stanceLen) * wb * char.dir;
        fy = ground;
      }
    }

    const dx = fx - hx, dy = fy - hy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const d = Math.min(dist, L * 2 - 0.1);
    let kx, ky;
    if (char.state === STATE.JUMP) {
      kx = (hx + fx) / 2; ky = (hy + fy) / 2;
    } else if (wb < 0.01 && char.state === STATE.IDLE) {
      kx = (hx + fx) / 2; ky = (hy + fy) / 2;
    } else if (d < 1) {
      kx = hx + side * L * 0.7; ky = hy + L * 0.7;
    } else {
      const cosA = Math.max(-1, Math.min(1, d / (2 * L)));
      const a = Math.acos(cosA);
      const baseAng = Math.atan2(dy, dx);
      const kneeAng = baseAng - side * a;
      kx = hx + Math.cos(kneeAng) * L; ky = hy + Math.sin(kneeAng) * L;
    }
    dots.push({ x: hx, y: hy, r: R, color: ORANGE });
    dots.push({ x: kx, y: ky, r: R, color: ORANGE });
    dots.push({ x: fx, y: fy, r: R, color: ORANGE });
  }

  // Body
  const ringGap = BR * 1.0;
  const numRings = Math.ceil(Math.min(bodyRx, bodyRy) / ringGap);
  for (let i = numRings; i >= 0; i--) {
    const scale = i / numRings;
    const rx = bodyRx * scale;
    const ry = bodyRy * scale;
    if (rx < 1 && ry < 1) {
      dots.push({ x: bx, y: bodyY, r: BR, color: ORANGE });
    } else {
      const circ = 2 * Math.PI * Math.max(rx, ry);
      const n = Math.max(1, Math.round(circ / (BR * 1.5)));
      const angOff = (i % 2 === 0) ? 0 : Math.PI / n;
      for (let j = 0; j < n; j++) {
        const a = (Math.PI * 2 * j) / n + angOff;
        dots.push({ x: bx + Math.cos(a) * rx, y: bodyY + Math.sin(a) * ry, r: BR, color: ORANGE });
      }
    }
  }

  // Eye
  const eyeX = bx + char.dir * bodyRx * 0.2;
  const eyeY = bodyY - bodyRy * 0.1;
  dots.push({ x: eyeX, y: eyeY, r: R * 2.2, color: '#fff' });
  dots.push({ x: eyeX, y: eyeY, r: R * 1.1, color: '#000' });

  return dots;
}

// ─── Update ───
function update(time, dt) {
  const base = groundY();
  char.baseY = base;

  // Scatter / Reassemble states
  if (char.state === STATE.SCATTER) {
    scatterTimer += dt;
    // Update particle physics
    for (const p of particles) {
      if (!p.onGround) {
        p.vy += 0.25;  // gravity
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;
        if (p.y >= base + p.r * 0.5) {
          p.y = base + p.r * 0.5;
          p.vy = -p.vy * 0.2;  // small bounce
          if (Math.abs(p.vy) < 1) {
            p.vy = 0;
            p.onGround = true;
          }
        }
      } else {
        // Rolling on ground with friction
        p.vx *= 0.97;
        p.x += p.vx;
        p.rotation += p.vx * 0.05;
      }
    }
    // After scattering for a while, start reassembling
    if (scatterTimer > 2500) {
      char.state = STATE.REASSEMBLE;
      char.stateTimer = 0;
      scatterTimer = 0;
    }
    return;
  }

  if (char.state === STATE.REASSEMBLE) {
    scatterTimer += dt;
    // Compute current targets
    const targets = computeDotTargets();
    // Lerp particles back to targets
    const progress = Math.min(1, scatterTimer / 1500);  // 1.5s to reassemble
    const ease = progress * progress * (3 - 2 * progress);  // smoothstep

    for (let i = 0; i < particles.length && i < targets.length; i++) {
      const t = targets[i];
      particles[i].x += (t.x - particles[i].x) * ease * 0.08;
      particles[i].y += (t.y - particles[i].y) * ease * 0.08;
      particles[i].r += (t.r - particles[i].r) * 0.1;
      particles[i].color = t.color;
      particles[i].vx *= 0.9;
      particles[i].vy *= 0.9;
      particles[i].rotation *= 0.95;
    }

    // Check if all particles are close enough
    if (scatterTimer > 1800) {
      char.state = STATE.IDLE;
      char.stateTimer = 0;
      char.nextActionTime = time + 1000 + Math.random() * 2000;
      particles = [];
    }
    return;
  }

  if (time > char.nextActionTime) pickNextAction(time);

  // Eye blink
  char.eyeBlinkTimer -= dt;
  if (char.eyeBlinkTimer <= 0) {
    char.eyeBlink = 1;
    char.eyeBlinkTimer = 2500 + Math.random() * 4000;
    setTimeout(() => { char.eyeBlink = 0; }, 120);
  }

  switch (char.state) {
    case STATE.IDLE:
      char.vx *= 0.9;
      char.legPhase = 0;
      break;
    case STATE.WALK:
      char.legPhase += dt * 0.01 * Math.abs(char.vx);
      break;
    case STATE.JUMP_PREP:
      char.crouch += (12 - char.crouch) * 0.12;
      char.vx *= 0.95;
      if (char.stateTimer > 300) {
        char.state = STATE.JUMP;
        char.stateTimer = 0;
        char.vy = -(8 + Math.random() * 3);
        char.vx = (Math.random() - 0.5) * 2.5;
        char.crouch = -6;
        char.crouchV = -3;
      }
      break;
    case STATE.JUMP:
      char.vy += 0.32;
      char.y += char.vy;
      char.crouch += (0 - char.crouch) * 0.08;
      if (char.y >= base) {
        char.y = base;
        const impactV = char.vy;
        char.vy = 0;
        char.crouch = 0;
        char.crouchV = impactV * 1.2;
        char.jellyV = impactV * 0.8;
        char.state = STATE.LANDING;
        char.stateTimer = 0;
      }
      break;
    case STATE.LANDING:
      if (char.stateTimer > 300 && Math.abs(char.crouch) < 2 && Math.abs(char.crouchV) < 2) {
        char.state = STATE.IDLE;
        char.crouch = 0; char.crouchV = 0;
        char.nextActionTime = time + 500 + Math.random() * 1500;
      }
      char.vx *= 0.92;
      break;
  }

  // Crouch spring
  if (char.state !== STATE.JUMP_PREP) {
    char.crouchV -= char.crouch * 0.2;
    char.crouchV *= 0.82;
    char.crouch += char.crouchV;
    if (Math.abs(char.crouch) < 0.2 && Math.abs(char.crouchV) < 0.2 && char.state !== STATE.LANDING) {
      char.crouch = 0; char.crouchV = 0;
    }
  }

  // Feed walk bob into jelly
  if (char.state === STATE.WALK) {
    const bobAccel = -char.walkBlend * Math.sin(char.legPhase * 2) * 0.15 * Math.abs(char.vx);
    char.jellyV += bobAccel;
  }

  // Jelly spring
  char.jellyV -= char.jellyD * 0.25;
  char.jellyV *= 0.78;
  char.jellyD += char.jellyV;
  if (Math.abs(char.jellyD) < 0.1 && Math.abs(char.jellyV) < 0.1) {
    char.jellyD = 0; char.jellyV = 0;
  }

  // Walk blend
  if (char.state === STATE.WALK) {
    char.walkBlend += (1 - char.walkBlend) * 0.08;
  } else {
    char.walkBlend = 0;
  }

  char.x += char.vx;
  const margin = 50;
  if (char.x < margin) {
    char.x = margin; char.vx = Math.abs(char.vx); char.dir = 1;
  } else if (char.x > canvas.width - margin) {
    char.x = canvas.width - margin; char.vx = -Math.abs(char.vx); char.dir = -1;
  }
  if (char.state !== STATE.JUMP) char.y = base;
  if (char.state === STATE.LANDING) char.vx *= 0.95;

  char.stateTimer += dt;
}

// ─── Draw ───
function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // If scattering or reassembling, draw particles
  if (char.state === STATE.SCATTER || char.state === STATE.REASSEMBLE) {
    for (const p of particles) {
      dot(p.x, p.y, p.r, p.color);
    }
    return;
  }

  // Normal drawing
  const targets = computeDotTargets();
  for (const t of targets) {
    dot(t.x, t.y, t.r, t.color);
  }
}

// ─── Main Loop ───
let lastTime = 0;
char.nextActionTime = 1000;

function loop(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
  lastTime = timestamp;

  update(timestamp, dt);
  draw(timestamp);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
